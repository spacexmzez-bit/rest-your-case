<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extreme | Rest Your Case</title><meta name="theme-color" content="#111820"><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="extreme.css?v=foundation-2-review2"><script src="ryc-ar.js?v=foundation-2-review2"></script><script src="ryc-runtime.js?v=consolidation-1"></script></head>
<body class="extreme-terminal" data-no-i18n><header><h1 id="title">RYC Extreme</h1><nav><a href="index.html" data-en="Overview" data-ar="الرئيسية">Overview</a><a href="shelf.html?mode=extreme" data-en="Extreme archive" data-ar="أرشيف القضايا القصوى">Extreme archive</a><a href="game.html#terminal" data-en="Standard trial" data-ar="المحاكمة العادية">Standard trial</a><a href="library.html" data-en="Legal library" data-ar="المكتبة القانونية">Legal library</a><button id="language" type="button">العربية / English</button></nav></header>
<main><div id="notice" class="extreme-warning" role="status" hidden></div><div id="save-warning" class="extreme-warning" role="alert" hidden></div><div id="status" class="extreme-status"></div><div id="resume" class="extreme-warning" hidden></div><nav><button id="sync" data-en="Sync / Resume" data-ar="مزامنة / استئناف">Sync / Resume</button><button id="next" hidden></button><button id="prosecution" hidden data-en="Continue prosecution" data-ar="تابع قضية الادعاء">Continue prosecution</button><button id="cache" data-en="Free older synced cache" data-ar="حرر ذاكرة السجلات القديمة المتزامنة">Free older synced cache</button><button id="clerk" data-en="Refresh character memory" data-ar="حدّث ذاكرة الشخصية">Refresh character memory</button><button id="purge" data-en="Permanently delete case" data-ar="احذف القضية نهائياً">Permanently delete case</button></nav>
<div class="extreme-columns"><div><section><h2 data-en="Conversation" data-ar="المحادثة">Conversation</h2><p id="recipient-indicator"></p><div id="feed" class="extreme-feed" role="log" aria-live="polite"></div><form id="compose"><label for="recipient" data-en="Speak to" data-ar="تحدث إلى">Speak to</label><select id="recipient"></select><label for="message" data-en="Your message" data-ar="رسالتك">Your message</label><textarea id="message" maxlength="2400"></textarea><button id="send" data-en="Send" data-ar="أرسل">Send</button></form><div id="pending" hidden><p data-en="An action is awaiting recovery. Its text is preserved." data-ar="يوجد إجراء ينتظر الاستعادة. نصه محفوظ.">An action is awaiting recovery. Its text is preserved.</p><button id="retry" data-en="Check status / Retry same action" data-ar="تحقق / أعد الإجراء نفسه">Check status / Retry same action</button><button id="discard" data-en="Check and discard failed request" data-ar="تحقق وتجاهل الطلب الفاشل">Check and discard failed request</button></div></section>
<section><h2 data-en="Original record" data-ar="السجل الأصلي">Original record</h2><form id="history-search"><input id="query" maxlength="300" aria-label="Search original record"><button data-en="Search" data-ar="ابحث">Search</button><button id="reset-history" type="button" data-en="First page" data-ar="الصفحة الأولى">First page</button></form><div id="history"></div><button id="more" data-en="Next page" data-ar="الصفحة التالية">Next page</button></section></div>
<aside><section><h2 data-en="Case file" data-ar="ملف القضية">Case file</h2><div id="case-file"></div></section><section><h2 data-en="Witnesses" data-ar="الشهود">Witnesses</h2><div id="witnesses"></div></section><section><h2 data-en="Evidence & investigations" data-ar="الأدلة والتحقيقات">Evidence & investigations</h2><div id="evidence"></div><div id="leads"></div></section><section><h2 data-en="Personal notes" data-ar="ملاحظاتك">Personal notes</h2><textarea id="notes" maxlength="50000"></textarea><p id="notes-status" role="status"></p></section><section><h2 data-en="Memory / source status" data-ar="حالة الذاكرة والمصادر">Memory / source status</h2><div id="memory"></div><p data-en="Case access is saved in this browser. Clearing browser data can lose access. Server cases expire after 90 days without activity. Offline: read cached records and edit notes; official actions require connection." data-ar="يحفظ هذا المتصفح وسيلة الوصول للقضية. مسح بياناته قد يفقدك الوصول. تنتهي القضية بعد 90 يوماً دون نشاط. دون اتصال: اقرأ السجلات المحفوظة وعدّل ملاحظاتك؛ الإجراءات الرسمية تتطلب الاتصال.">Case access is saved in this browser.</p></section></aside></div></main>
